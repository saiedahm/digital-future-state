name: Integration security guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify payment and account safety invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const checkout = fs.readFileSync('api/stripe-checkout.js', 'utf8');
          const webhook = fs.readFileSync('api/stripe-webhook.js', 'utf8');
          const portal = fs.readFileSync('api/stripe-portal.js', 'utf8');
          const health = fs.readFileSync('api/health.js', 'utf8');
          const account = fs.readFileSync('account/index.html', 'utf8');
          const authPage = fs.readFileSync('account/auth.html', 'utf8');
          const config = fs.readFileSync('supabase/config.js', 'utf8');
          const homepage = fs.readFileSync('index.html', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');

          const required = [
            [checkout, 'APP_ALLOWED_ORIGINS', 'Checkout must validate allowed origins.'],
            [checkout, 'Authorization: authHeader', 'Checkout must validate the signed-in user's token with Supabase.'],
            [checkout, 'price.unit_amount !== plan.amount', 'Checkout must validate the configured price amount.'],
            [checkout, 'price.currency !== "eur"', 'Checkout must validate EUR currency.'],
            [checkout, 'price.recurring.interval !== "month"', 'Checkout must validate monthly recurrence.'],
            [webhook, 'timingSafeEqual', 'Webhook signature comparison must be timing-safe.'],
            [webhook, 'STRIPE_WEBHOOK_SECRET', 'Webhook signing secret must be required.'],
            [webhook, 'stripe_webhook_events', 'Webhook event deduplication must remain enabled.'],
            [webhook, 'Invalid or expired Stripe signature', 'Webhook must reject invalid signatures.'],
            [portal, 'APP_ALLOWED_ORIGINS', 'Billing portal must validate allowed origins.'],
            [portal, 'Authorization: authHeader', 'Billing portal must validate the signed-in user's token.'],
            [account, 'deleteProfile', 'Account page should expose the profile deletion control.'],
            [authPage, 'const APP_ORIGIN=location.origin', 'Authentication callbacks must use the current site origin, not a hard-coded legacy domain.'],
            [authPage, 'emailRedirectTo:authReturnUrl', 'Email confirmation must return to the current site authentication page.'],
            [authPage, 'redirectTo:authReturnUrl', 'Password recovery must return to the current site authentication page.'],
            [config, 'sb_publishable_', 'Browser Supabase configuration must use a publishable key.'],
            [health, 'paymentMode', 'Health endpoint must report the detected Stripe key mode.'],
            [health, 'releaseReady = false', 'Health endpoint must not claim release readiness from configuration presence alone.'],
            [health, 'stripeSecretFormatValid', 'Health endpoint must validate Stripe secret-key format.']
          ];
          for (const [source, token, message] of required) {
            if (!source.includes(token)) throw new Error(message);
          }

          for (const [name, source] of [['checkout', checkout], ['webhook', webhook], ['portal', portal], ['health', health]]) {
            if (/sk_live_[A-Za-z0-9]{12,}/.test(source) || /whsec_[A-Za-z0-9]{12,}/.test(source)) {
              throw new Error('Possible hard-coded Stripe secret found in ' + name + ' source.');
            }
          }
          if (/service_role/i.test(config) || /SUPABASE_SERVICE_ROLE_KEY/.test(config)) {
            throw new Error('Private Supabase service-role key must never appear in browser configuration.');
          }

          const schema = fs.readFileSync('database/schema.sql', 'utf8');
          for (const token of [
            'alter table public.profiles enable row level security',
            'alter table public.requests enable row level security',
            'alter table public.memberships enable row level security',
            'revoke insert, update, delete on public.memberships from anon, authenticated',
            'create policy "memberships_select_own"'
          ]) {
            if (!schema.includes(token)) throw new Error('Database security invariant missing: ' + token);
          }
          for (const token of ['trial-banner', '30 October 2026', '30/10/2026', 'TRIAL PERIOD']) {
            if (!homepage.includes(token)) throw new Error('Trial announcement missing required text: ' + token);
          }
          for (const token of ['.trial-banner', 'max-width:600px', 'var(--gold2)']) {
            if (!styles.includes(token)) throw new Error('Trial announcement styling missing: ' + token);
          }

          // Keep the citizen-facing priority directory complete and transparent.
          const priorityMatch = homepage.match(/<section[^>]*id="citizen-services"[^>]*>([\\s\\S]*?)<\\/section>/);
          if (!priorityMatch) throw new Error('Citizen priority services section is missing.');
          const priority = priorityMatch[1];
          const priorityCards = priority.match(/class="priority-service-card"/g) || [];
          if (priorityCards.length !== 10) {
            throw new Error('Citizen priority directory must contain exactly ten service cards; found ' + priorityCards.length + '.');
          }
          for (const token of [
            'https://www.google.com/',
            'https://www.microsoft.com/',
            'https://stripe.com/',
            'https://www.paypal.com/',
            'https://www.linkedin.com/',
            'https://business.whatsapp.com/',
            'https://maps.google.com/',
            'https://translate.google.com/',
            'https://www.dhl.com/',
            'https://www.booking.com/',
            '/integrations/priority-ten.html',
            'technical integration not yet verified',
            'not endorsements or claims of partnership'
          ]) {
            if (!priority.includes(token)) throw new Error('Citizen priority directory is missing required link or transparent status: ' + token);
          }
          const externalLinks = [...priority.matchAll(/<a\\b[^>]*href="https?:\\/\\/[^"]+"[^>]*>/g)].map(match => match[0]);
          if (externalLinks.length !== 10 || externalLinks.some(link => !link.includes('target="_blank"') || !link.includes('rel="noopener noreferrer"'))) {
            throw new Error('All ten official provider links must open safely in a new tab.');
          }
          const directoryScript = fs.readFileSync('app.js', 'utf8');
          if (directoryScript.includes('verified-format listings loaded')) {
            throw new Error('Directory must not imply listings are verified merely because they have URL format.');
          }
          for (const token of ['Official URLs are listed for discovery', 'availability, verification and partnership are not implied']) {
            if (!directoryScript.includes(token)) throw new Error('Directory transparency message missing: ' + token);
          }
          console.log('Static security guardrails, trial banner, priority-ten directory, and directory-transparency checks passed. Runtime configuration and end-to-end tests are still required.');
          NODE
      - name: Test payment health endpoint fail-closed status
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const handler = require('./api/health.js');
          const keys = {
            SUPABASE_URL: 'https://example.supabase.co',
            SUPABASE_SERVICE_ROLE_KEY: 'test-only-placeholder',
            APP_ALLOWED_ORIGINS: 'https://example.com',
            STRIPE_SECRET_KEY: 'sk_test_example123',
            STRIPE_WEBHOOK_SECRET: 'whsec_test_placeholder',
            STRIPE_PRICE_499: 'price_test499',
            STRIPE_PRICE_699: 'price_test699',
            STRIPE_PRICE_899: 'price_test899',
            STRIPE_PRICE_1199: 'price_test1199',
            STRIPE_PRICE_1399: 'price_test1399'
          };
          const names = Object.keys(keys);
          const previous = Object.fromEntries(names.map(key => [key, process.env[key]]));
          async function callHealth() {
            let statusCode;
            let body;
            const res = {
              setHeader() {},
              status(code) { statusCode = code; return this; },
              json(value) { body = value; return this; }
            };
            await handler({ method: 'GET' }, res);
            return { statusCode, body };
          }
          (async () => {
            try {
              Object.assign(process.env, keys);
              let result = await callHealth();
              assert.equal(result.statusCode, 200);
              assert.equal(result.body.paymentMode, 'test');
              assert.equal(result.body.paymentConfigurationPresent, true);
              assert.equal(result.body.releaseReady, false);
              assert.equal(result.body.status, 'configuration-present-not-verified');

              process.env.STRIPE_SECRET_KEY = 'malformed-key';
              result = await callHealth();
              assert.equal(result.body.paymentConfigurationPresent, false);
              assert.equal(result.body.checks.stripeSecretFormatValid, false);
              assert.equal(result.body.releaseReady, false);

              delete process.env.STRIPE_PRICE_499;
              process.env.STRIPE_SECRET_KEY = 'sk_test_example123';
              result = await callHealth();
              assert.equal(result.body.paymentConfigurationPresent, false);
              assert.equal(result.body.status, 'configuration-incomplete');
              assert.equal(result.body.releaseReady, false);
              console.log('Health endpoint fail-closed tests passed.');
            } finally {
              for (const key of names) {
                if (previous[key] === undefined) delete process.env[key];
                else process.env[key] = previous[key];
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Check server endpoint syntax
        run: |
          node --check api/stripe-checkout.js
          node --check api/stripe-webhook.js
          node --check api/stripe-portal.js
          node --check api/health.js
