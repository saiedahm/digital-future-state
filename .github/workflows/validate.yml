name: Static site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate required pages and legal links
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const required = ['widerruf.html','agb.html','datenschutz.html','impressum.html'];
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error('Missing required legal page: ' + file);
            if (!html.includes('href="' + file + '"')) throw new Error('Legal page not linked from homepage: ' + file);
          }
          for (const id of ['languageSelect','profileForm','contactForm','cookieSettings','cookieBanner']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required UI element: ' + id);
          }
          for (const token of ['function applyLanguage','languagePacks','document.documentElement.dir']) {
            if (!js.includes(token)) throw new Error('Missing multilingual behavior: ' + token);
          }
          if (!html.includes('© 2026 digital-future.ai')) throw new Error('Required copyright notice is missing.');
          console.log('Static checks passed: legal pages, language selector, profile form, contact form, cookie settings and copyright.');
          NODE
