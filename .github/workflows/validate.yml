name: Static site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check account scripts and core product consistency
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const requiredInlinePages = ['account/auth.html', 'account/index.html'];
          for (const file of requiredInlinePages) {
            if (!fs.existsSync(file)) throw new Error('Missing account page: ' + file);
            const source = fs.readFileSync(file, 'utf8');
            const scripts = [...source.matchAll(new RegExp('<script[^>]*>([\\s\\S]*?)</script>', 'gi'))].map(match => match[1].trim()).filter(Boolean);
            if (!scripts.length) throw new Error('No inline JavaScript found in ' + file);
            scripts.forEach((script, index) => {
              try { new Function(script); }
              catch (error) { throw new Error('Inline JavaScript syntax error in ' + file + ' script ' + (index + 1) + ': ' + error.message); }
            });
          }
          const auth = fs.readFileSync('account/auth.html', 'utf8');
          for (const id of ['google','azure','recoveryBox','saveNewPassword']) {
            if (!auth.includes('id="' + id + '"')) throw new Error('Missing expected auth feature: ' + id);
          }
          const account = fs.readFileSync('account/index.html', 'utf8');
          for (const id of ['authState','signOut','deleteProfile','exportBackup']) {
            if (!account.includes('id="' + id + '"')) throw new Error('Missing expected account feature: ' + id);
          }
          for (const token of ["from('profiles').upsert", "from('profiles').delete", "profile-photos"]) {
            if (!account.includes(token)) throw new Error('Missing account data operation: ' + token);
          }
          const integration = fs.readFileSync('integrations/index.html', 'utf8');
          const candidateCount = (integration.match(/<article class="card">/g) || []).length;
          if (candidateCount !== 20) throw new Error('Expected 20 integration candidates, found ' + candidateCount);
          if (!fs.readFileSync('index.html', 'utf8').includes('Integration pilot · 20 providers')) {
            throw new Error('Integration pilot is not linked from the homepage.');
          }
          const globalCatalog = fs.readFileSync('integrations/global-directory.html', 'utf8');
          const regionDataMatch = globalCatalog.match(/const REGIONS=(\[[\s\S]*?\]);\nconst modes=/);
          if (!regionDataMatch) throw new Error('Could not find global integration region data.');
          const regionData = JSON.parse(regionDataMatch[1]);
          if (regionData.length !== 6) throw new Error('Expected six regions in global directory.');
          for (const region of regionData) {
            if (region.items.length !== 20) throw new Error('Expected 20 candidates in region ' + region.title);
            for (const item of region.items) {
              if (!item[0] || !item[1] || !/^https:\/\//.test(item[2]) || !item[3]) {
                throw new Error('Incomplete company entry in region ' + region.title + ': ' + JSON.stringify(item));
              }
            }
          }
          if (!fs.readFileSync('index.html', 'utf8').includes('/integrations/global-directory.html')) {
            throw new Error('Global 120-candidate directory is not linked from the homepage.');
          }
          if (!fs.readFileSync('integrations/index.html', 'utf8').includes('/integrations/global-directory.html')) {
            throw new Error('Global directory is not linked from the original 20-candidate pilot.');
          }
          const membership = fs.readFileSync('membership/index.html', 'utf8');
          const planCount = (membership.match(/<article class="plan(?: featured)?">/g) || []).length;
          if (planCount !== 6) throw new Error('Expected six membership display tiers, found ' + planCount);
          for (const amount of ['€4.99','€6.99','€8.99','€11.99','€13.99']) {
            if (!membership.includes(amount)) throw new Error('Approved membership price is missing: ' + amount);
          }
          for (const file of ['index.html','account/index.html','membership/index.html','app.js','database/schema.sql']) {
            if (fs.readFileSync(file,'utf8').includes('€15.99')) throw new Error('Unapproved €15.99 price is displayed in ' + file);
          }
          if (fs.readFileSync('database/schema.sql','utf8').includes('1599')) {
            throw new Error('Unapproved 1599-cent amount remains in database/schema.sql');
          }
          const checkout = fs.readFileSync('api/stripe-checkout.js','utf8');
          for (const priceKey of ['STRIPE_PRICE_499','STRIPE_PRICE_699','STRIPE_PRICE_899','STRIPE_PRICE_1199','STRIPE_PRICE_1399']) {
            if (!checkout.includes(priceKey)) throw new Error('Checkout price mapping is missing: ' + priceKey);
          }
          if (!fs.existsSync('membership/success.html')) throw new Error('Checkout success page is missing.');
          if (!fs.existsSync('supabase/migrations/20261010020000_stripe_webhook_idempotency.sql')) {
            throw new Error('Stripe webhook event ledger migration is missing.');
          }
          if (!fs.existsSync('supabase/migrations/20261011000000_profile_self_delete.sql')) {
            throw new Error('Profile self-delete migration is missing.');
          }
          const membershipScripts = [...membership.matchAll(new RegExp('<script[^>]*>([\\s\\S]*?)</script>', 'gi'))].map(match => match[1].trim()).filter(Boolean);
          membershipScripts.forEach((script, index) => {
            try { new Function(script); }
            catch (error) { throw new Error('Inline JavaScript syntax error in membership/index.html script ' + (index + 1) + ': ' + error.message); }
          });
          for (const file of ['api/stripe-checkout.js','api/stripe-webhook.js','api/stripe-portal.js','api/health.js','api/requests.js']) {
            const { execFileSync } = require('node:child_process');
            try { execFileSync(process.execPath, ['--check', file], { stdio: 'pipe' }); }
            catch (error) { throw new Error('JavaScript syntax error in ' + file + ': ' + error.stderr.toString()); }
          }
          console.log('Account and membership JavaScript syntax, API syntax, global directory, six plan tiers, and approved price checks passed.');
          NODE
      - name: Validate pages, assets, links, and required interface
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          const requiredPages = ['widerruf.html','agb.html','datenschutz.html','impressum.html','404.html'];
          for (const file of requiredPages) {
            if (!fs.existsSync(file)) throw new Error('Missing required page: ' + file);
          }
          for (const file of ['assets/dfs-emblem.svg','assets/favicon.svg','manifest.webmanifest','robots.txt','sitemap.xml','vercel.json']) {
            if (!fs.existsSync(file)) throw new Error('Missing required asset/config: ' + file);
          }
          for (const file of ['widerruf.html','agb.html','datenschutz.html','impressum.html']) {
            if (!html.includes('href="' + file + '"')) throw new Error('Legal page not linked from homepage: ' + file);
          }
          for (const id of ['languageSelect','profileForm','contactForm','cookieSettings','cookieBanner','contactConsent','contactTopic']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required UI element: ' + id);
          }
          for (const token of ['function applyLanguage','languagePacks','document.documentElement.dir','localStorage']) {
            if (!js.includes(token)) throw new Error('Missing expected client behavior: ' + token);
          }
          for (const file of ['assets/dfs-emblem.svg','assets/favicon.svg']) {
            if (!fs.readFileSync(file,'utf8').includes('<svg')) throw new Error('Invalid SVG asset: ' + file);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if (!manifest.name || !Array.isArray(manifest.icons)) throw new Error('Manifest fields are incomplete');
          const config = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if (!Array.isArray(config.headers)) throw new Error('Vercel headers configuration missing');
          if (!html.includes('© 2026 digital-future.ai')) throw new Error('Required copyright notice is missing.');
          if (!css.includes(':focus-visible')) throw new Error('Keyboard focus style missing.');
          console.log('Static quality checks passed. This does not replace end-to-end browser/security testing.');
          NODE
